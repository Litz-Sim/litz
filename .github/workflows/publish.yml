name: publish

# Publishing is triggered by a version tag, so the tarball and the crates
# always match a commit: `git tag v0.4.0 && git push origin v0.4.0`. The tag
# must equal the versions in Cargo.toml and js/package.json; `verify` refuses
# the release otherwise.
#
# Both registries use trusted publishing: GitHub's OIDC token stands in for a
# long-lived token, so there is no secret to rotate and no 2FA prompt. Each
# crate must name this workflow as its trusted publisher on crates.io
# (Settings -> Trusted Publishing: owner Litz-Sim, repository litz, workflow
# publish.yml); the npm package does the same on npmjs.com.

on:
  push:
    tags:
      - "v*"

permissions:
  # `contents: write` is what creates the GitHub release for the tag.
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag, the crates and npm agree
        run: |
          tag=${GITHUB_REF_NAME#v}
          crates=$(awk '/^\[workspace.package\]/{inside=1; next} /^\[/{inside=0} inside && /^version =/ {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          npm=$(sed -n 's/^  "version": "\([^"]*\)",$/\1/p' js/package.json | head -1)
          echo "tag $tag, crates $crates, npm $npm"
          test "$tag" = "$crates"
          test "$tag" = "$npm"

  # One native runner per target, no cross-compilation: each artifact is built
  # and exercised by the platform that will run it. The x86_64 Linux build sits
  # in an Ubuntu 20.04 container because that image pins the glibc floor at
  # 2.31; building on the newer runner directly would quietly raise the minimum
  # a user needs. (Debian 11 would do the same, but its security archive is
  # gone, so apt cannot install a compiler there any more.)
  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            container: ubuntu:20.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            container: ""
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - runner: macos-15
            container: ""
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: macos-15-intel
            container: ""
            target: x86_64-apple-darwin
            ext: tar.gz
          - runner: windows-latest
            container: ""
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.runner }}
    # An empty value means "no container", so the other four jobs run
    # directly on their runner.
    container: ${{ matrix.container }}
    steps:
      # The bare Ubuntu image has no compiler and not even git, which checkout
      # needs, so the toolchain goes in before any action runs.
      - name: Install the tools the bare Ubuntu image lacks
        if: matrix.container != ''
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git curl ca-certificates

      - uses: actions/checkout@v4

      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          version=$(awk '/^\[workspace.package\]/{inside=1; next} /^\[/{inside=0} inside && /^version =/ {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        shell: bash
        run: cargo build --release -p litz-cli --bin litz

      # The tarball holds the executable alone at its root so a user can
      # unpack it onto PATH. A missing strip is not fatal: the binary still
      # runs, it just carries its symbol table.
      - name: Strip and package the executable
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if command -v strip >/dev/null 2>&1; then
            strip target/release/litz
          else
            echo "strip is not installed; packaging the unstripped binary"
          fi
          mkdir -p dist
          cp target/release/litz dist/litz
          archive="litz-$VERSION-$TARGET.$EXT"
          tar -C dist -czf "$archive" litz
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "checksums-$TARGET.txt"
          else
            shasum -a 256 "$archive" > "checksums-$TARGET.txt"
          fi

      - name: Package the executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "litz-$env:VERSION-$env:TARGET.zip"
          Compress-Archive -Path target/release/litz.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "checksums-$env:TARGET.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: litz-${{ matrix.target }}
          path: |
            litz-${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}
            checksums-${{ matrix.target }}.txt
          if-no-files-found: error

  crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The OIDC exchange needs this job to be the trusted publisher for every
      # crate it publishes. A crate without that configuration is refused
      # before cargo runs.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: tools/publish-crates.sh

  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The package's prepublish build compiles the wasm module, so this job
      # needs the same target the local build uses.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 ships npm 10, which has no OIDC publishing: it looks for a
      # token, finds none and exits ENEEDAUTH before npmjs ever sees the
      # workflow. Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@^11
      # `prepublishOnly` builds the module and runs the package's tests, so a
      # tag that does not pass them never reaches the registry. No token is
      # configured on purpose: npm exchanges the workflow's OIDC token for a
      # short-lived publish credential. A version already on the registry is
      # skipped, so re-running the workflow after a later step failed still
      # reaches the release without a conflict.
      - name: Publish to npm
        working-directory: js
        run: |
          version=$(node -p "require('./package.json').version")
          # Ask the registry document directly: `npm view` reads a cached
          # copy, and a version published by the previous run of this workflow
          # can be missing from it for a minute, which turns the check into a
          # second publish attempt.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@litz-sim%2Flitz/$version")
          if [ "$code" = 200 ]; then
            echo "@litz-sim/litz@$version is already published"
            exit 0
          fi
          set +e
          output=$(npm publish --provenance --access public 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # The same race from the other side: the registry accepted an
          # earlier publish that this check could not see yet.
          if printf '%s' "$output" | grep -q 'previously published'; then
            echo "@litz-sim/litz@$version was already published"
            exit 0
          fi
          exit "$status"

  smoke:
    needs: [crates, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Install the version this tag published, with the lockfile its tarball
      # ships. The workspace builds against path dependencies, so a vendored
      # crate that changed without a new registry version passes every unit
      # test and still fails here.
      - run: tools/install-smoke.sh --version "${GITHUB_REF_NAME#v}"

  # The release is the single place assets land: every binary job uploads an
  # artifact, this job gathers them into one directory and attaches them to the
  # tag's release, so a rerun after a partial failure converges on the same
  # asset set.
  release:
    needs: [crates, npm, smoke, binaries]
    # The registries are the deliverable; the binaries are attached to the page
    # this job creates. One target failing (a retired runner image, say) must
    # not take the release page down with it, so the guard names the three
    # publish jobs and tolerates a partial binary set.
    if: always() && needs.crates.result == 'success' && needs.npm.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: litz-*
          merge-multiple: true
          path: dist

      # The tag is the release boundary: one GitHub release with generated
      # notes per version. Re-running the workflow reuses an existing release
      # instead of failing on the second create.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Litz $GITHUB_REF_NAME" \
              --generate-notes

      # `checksums.txt` is the one file the CI action reads, so the per-target
      # lists are folded into it before upload; the per-target files stay for
      # anyone verifying a single archive.
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          shopt -s nullglob
          archives=(litz-*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no binaries reached this job; the release page is still created"
            exit 0
          fi
          cat checksums-*.txt > checksums.txt
          gh release upload "$GITHUB_REF_NAME" "${archives[@]}" checksums.txt --clobber
