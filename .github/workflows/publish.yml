name: publish

# Publishing is triggered by a version tag, so the tarball always matches a
# commit: `git tag v0.1.0 && git push origin v0.1.0`.
#
# The package is published with npm's trusted publishing: GitHub's OIDC token
# stands in for a long-lived npm token, so there is no secret to rotate and no
# 2FA prompt. That requires the package to name this workflow as its trusted
# publisher on npmjs.com (package settings -> Trusted Publisher -> GitHub
# Actions: owner Litz-Sim, repository litz, workflow publish.yml).

on:
  push:
    tags:
      - "v*"

permissions:
  # `contents: write` is what creates the GitHub release for the tag.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 ships npm 10, which has no OIDC publishing: it looks for a
      # token, finds none and exits ENEEDAUTH before npmjs ever sees the
      # workflow. Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@^11
      # `prepublishOnly` builds the module and runs the package's tests, so a
      # tag that does not pass them never reaches the registry. No token is
      # configured on purpose: npm exchanges the workflow's OIDC token for a
      # short-lived publish credential.
      - run: cd js && npm publish --provenance --access public
      # The tag is the release boundary: one GitHub release with generated
      # notes per version. Re-running the workflow reuses an existing release
      # instead of failing on the second create.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Litz $GITHUB_REF_NAME" \
              --generate-notes
