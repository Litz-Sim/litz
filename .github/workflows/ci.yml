name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace suite needs no downloaded assets: the fixture firmware and
      # the wasm chip module are in the tree. ROM-backed ESP-IDF tests are
      # #[ignore]d and need files this job deliberately does not fetch.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The examples are the product: a check, a test and a run through the
      # same binary a user installs.
      - run: cargo run -q -p litz-cli -- check examples/blinky
      - run: cargo run -q -p litz-cli -- test examples/blinky
      - run: cargo run -q -p litz-cli -- test examples/button
      - run: cargo run -q -p litz-cli -- test examples/rv32
      - run: cargo run -q -p litz-cli -- test examples/pot
      - run: cargo run -q -p litz-cli -- test examples/echo
      - run: cargo run -q -p litz-cli -- test examples/uno-blink
      - run: cargo run -q -p litz-cli -- test examples/pico-blink
      - run: cargo run -q -p litz-cli -- test examples/pico-c-systick
      - run: cargo run -q -p litz-cli -- test examples/pico-c-i2c
      - run: cargo run -q -p litz-cli -- test examples/two-boards
      - run: cargo run -q -p litz-cli -- test examples/signal-generator

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The npm package builds the module from this tree and then drives it
      # with real firmware, so a broken export fails here rather than at
      # `npm publish`.
      - run: cd js && node scripts/build.mjs
      - run: cd js && node --test test/*.test.js
      - run: cd js && npm pack --dry-run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: ./web/build.sh
      - run: test -s web/litz_wasm.wasm
      # The page calls `WebAssembly.instantiate(bytes, {})`, so the module must
      # stay import-free. TLS used to be the reason this could not hold.
      - run: |
          node -e 'const fs=require("fs"); const m=new WebAssembly.Module(fs.readFileSync("web/litz_wasm.wasm")); const i=WebAssembly.Module.imports(m); if (i.length) { console.error("wasm imports:", i); process.exit(1); }'
      # Run a real handshake in the wasm module, not just compile one.
      - run: |
          target_dir=$(cargo metadata --format-version 1 --no-deps |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
          cargo build -p litz-wasm --target wasm32-unknown-unknown --release --features tls-probe
          node tools/tls-probe.mjs "$target_dir/wasm32-unknown-unknown/release/litz_wasm.wasm"
      # The workbench is plain ES modules: no bundler, and the catalog data it
      # ships must stay in step with the TOML manifests.
      - run: mkdir -p build && cargo run -q -p litz-cli -- catalog --json > build/catalog.ci.json
      - run: diff -u web/workbench/catalog.json build/catalog.ci.json
      - run: cd web/workbench && node --test test/*.test.js