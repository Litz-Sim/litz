name: ci

on:
  # A release is a tag on a commit whose branch push already ran this
  # workflow; letting tag pushes start it again only doubles the work.
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace suite needs no downloaded assets: the fixture firmware and
      # the wasm chip module are in the tree. ROM-backed ESP-IDF tests are
      # #[ignore]d and need files this job deliberately does not fetch.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The examples are the product: a check, a test and a run through the
      # same binary a user installs.
      - run: cargo run -q -p litz-cli -- check examples/blinky
      - run: cargo run -q -p litz-cli -- test examples/blinky
      - run: cargo run -q -p litz-cli -- test examples/button
      - run: cargo run -q -p litz-cli -- test examples/rv32
      - run: cargo run -q -p litz-cli -- test examples/pot
      - run: cargo run -q -p litz-cli -- test examples/echo
      - run: cargo run -q -p litz-cli -- test examples/uno-blink
      - run: cargo run -q -p litz-cli -- test examples/pico-blink
      - run: cargo run -q -p litz-cli -- test examples/pico-c-systick
      - run: cargo run -q -p litz-cli -- test examples/pico-c-i2c
      # The custom part has its own workspace, so the chip's unit tests are
      # outside `cargo test --workspace`.
      - run: cargo test --manifest-path examples/sn76489/part/Cargo.toml
      - run: cargo clippy --manifest-path examples/sn76489/part/Cargo.toml --all-targets -- -D warnings
      - run: cargo run -q -p litz-cli -- test examples/sn76489
      # Verilog rather than Rust, and GPL-3.0: the component is committed, so
      # the job needs no Verilator or wasi-sdk.
      - run: cargo run -q -p litz-cli -- test examples/ym2610
      - run: cargo run -q -p litz-cli -- test examples/two-boards
      - run: cargo run -q -p litz-cli -- test examples/signal-generator

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The npm package builds the module from this tree and then drives it
      # with real firmware, so a broken export fails here rather than at
      # `npm publish`.
      - run: cd js && node scripts/build.mjs
      - run: cd js && node --test test/*.test.js
      - run: cd js && npm pack --dry-run
