[package]
name = "litz-board"
description = "Board runtime for Litz: flatten a diagram, resolve nets, and drive parts from pin levels."
keywords = ["simulator", "netlist", "electronics", "embedded"]
categories = ["emulators", "embedded"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
litz-analog = { workspace = true }
litz-ble = { workspace = true }
litz-catalog = { workspace = true }
litz-core = { workspace = true }
litz-diagram = { workspace = true }
litz-ieee802154 = { workspace = true }
litz-net = { workspace = true }
litz-radio = { workspace = true }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Wasm parts need wasmtime, which does not build for wasm32-unknown-unknown.
# The native runtime gets the backend; the browser crate is itself a wasm
# module and cannot load a second component, so it keeps the builtin engines.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
litz-part-wasm = { workspace = true }
