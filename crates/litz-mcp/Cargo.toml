[package]
name = "litz-mcp"
description = "Rust-native Model Context Protocol server for Litz: stdio JSON-RPC over the existing simulator."
keywords = ["simulator", "mcp", "json-rpc", "embedded"]
categories = ["emulators", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
litz-catalog = { workspace = true }
litz-core = { workspace = true }
litz-diagram = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
