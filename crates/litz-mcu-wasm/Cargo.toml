[package]
name = "litz-mcu-wasm"
description = "Runs a microcontroller provided as a WebAssembly component, and componentizes the core module a guest crate builds."
keywords = ["simulator", "emulator", "wasm", "component-model"]
categories = ["emulators", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
litz-ble = { version = "0.0.1", path = "../litz-ble" }
litz-board = { version = "0.0.1", path = "../litz-board" }
litz-core = { version = "0.0.1", path = "../litz-core" }
litz-mcu-wit = { version = "0.0.1", path = "../litz-mcu-wit" }
litz-net = { version = "0.0.1", path = "../litz-net" }
thiserror = "2.0.21"
wasmtime = "50"

[[bin]]
name = "litz-componentize"
path = "src/bin/componentize.rs"
required-features = ["tooling"]

[features]
tooling = ["dep:wit-component"]

[dev-dependencies]
litz-catalog = { path = "../litz-catalog" }
litz-diagram = { path = "../litz-diagram" }
litz-fixture = { path = "../litz-fixture" }

[dependencies.wit-component]
version = "0.261.0"
optional = true
