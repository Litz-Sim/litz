[package]
name = "litz-wasm"
description = "WebAssembly bindings for Litz: run the same simulator in a browser, in Node, or under WASI."
keywords = ["simulator", "wasm", "embedded", "emulator"]
categories = ["emulators", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
litz-board = { version = "0.1.0", path = "../litz-board" }
litz-core = { version = "0.1.0", path = "../litz-core" }
litz-diagram = { version = "0.1.0", path = "../litz-diagram" }
litz-engine = { version = "0.1.0", path = "../litz-engine" }
litz-esp = { version = "0.1.0", path = "../litz-esp", features = ["esp32c3", "esp32c6", "esp32p4", "esp32s31"] }
litz-mcu = { version = "0.1.0", path = "../litz-mcu" }
litz-net = { version = "0.1.0", path = "../litz-net", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
litz-fixture = { version = "0.1.0", path = "../litz-fixture" }

[features]
# `litz_tls_probe`: an export `tools/tls-probe.mjs` calls on the built module
# to run a TLS handshake in the browser build. Not part of a page's ABI.
tls-probe = ["dep:litz-net"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
litz-mcu-wasm = { version = "0.1.0", path = "../litz-mcu-wasm" }
