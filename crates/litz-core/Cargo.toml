[package]
name = "litz-core"
description = "Core traits and types for Litz, an open-source, modular firmware simulator that runs natively and in WebAssembly."
keywords = ["simulator", "emulator", "embedded", "firmware", "wasm"]
categories = ["emulators", "embedded", "no-std"]
# 0.1.0 is already on crates.io without `Part::current_limit`; a dependent
# published today has to resolve a release that carries it. Everything else
# stays on the workspace version, and `^0.1.0` requirements pick this up.
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

