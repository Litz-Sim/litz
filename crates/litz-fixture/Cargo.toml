[package]
name = "litz-fixture"
description = "Dependency-free ESP32-C3 firmware fixtures: hand-assembled blinky and hello images for Litz."
keywords = ["simulator", "esp32", "firmware", "riscv"]
categories = ["emulators", "embedded"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "litz-fixture"
path = "src/main.rs"

# No dependencies, on purpose: these images must be buildable and runnable
# with nothing but a Rust toolchain, no ESP-IDF, no RISC-V GCC, no downloaded
# binary assets.
[dependencies]