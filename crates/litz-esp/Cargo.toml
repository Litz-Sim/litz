[package]
name = "litz-esp"
description = "ESP32-family chips for Litz: ESP32-C3/C6 RISC-V cores, memory maps, boot ROM loading and on-chip peripherals."
keywords = ["simulator", "emulator", "esp32", "riscv", "embedded"]
categories = ["emulators", "embedded"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
litz-esp-periph = { version = "0.1.0", path = "../../vendor/esp-periph", optional = true }
litz-esp-soc = { version = "0.1.2", path = "../../vendor/esp-soc", optional = true }
litz-esp32 = { version = "0.1.1", path = "../../vendor/esp32", optional = true }
litz-esp32c3 = { version = "0.1.1", path = "../../vendor/esp32c3", optional = true }
litz-esp32c6 = { version = "0.1.1", path = "../../vendor/esp32c6", optional = true }
litz-esp32p4 = { version = "0.1.1", path = "../../vendor/esp32p4", optional = true }
litz-esp32s3 = { version = "0.1.1", path = "../../vendor/esp32s3", optional = true }
litz-esp32s31 = { version = "0.1.1", path = "../../vendor/esp32s31", optional = true }
litz-ble = { workspace = true, optional = true }
litz-board = { workspace = true, optional = true }
litz-net = { workspace = true, optional = true }
litz-core = { workspace = true }
litz-mcu = { workspace = true }
gdbstub = "0.7.10"
litz-emu-core = { version = "0.1.0", path = "../../vendor/emu-core" }

[features]
esp32c3 = ["dep:litz-esp32c3", "dep:litz-esp-soc", "dep:litz-esp-periph", "dep:litz-ble", "dep:litz-board", "dep:litz-net"]
esp32c6 = ["dep:litz-esp32c6", "dep:litz-esp-soc", "dep:litz-esp-periph", "dep:litz-ble", "dep:litz-board", "dep:litz-net"]
esp32 = ["dep:litz-esp32", "dep:litz-esp-soc", "dep:litz-esp-periph", "dep:litz-ble", "dep:litz-board", "dep:litz-net"]
esp32s3 = ["dep:litz-esp32s3", "dep:litz-esp-soc", "dep:litz-esp-periph", "dep:litz-ble", "dep:litz-board", "dep:litz-net"]
esp32p4 = ["dep:litz-esp32p4", "dep:litz-esp-soc", "dep:litz-esp-periph", "dep:litz-ble", "dep:litz-board", "dep:litz-net"]
esp32s31 = ["dep:litz-esp32s31", "dep:litz-esp-soc", "dep:litz-esp-periph", "dep:litz-ble", "dep:litz-board", "dep:litz-net"]

[[test]]
name = "c3_boot"
required-features = ["esp32c3"]

[[example]]
name = "c3_boot"
required-features = ["esp32c3"]

[dev-dependencies]
litz-esp-soc = { version = "0.1.2", path = "../../vendor/esp-soc" }
litz-board = { workspace = true }
litz-catalog = { workspace = true }
litz-chip-conformance = { workspace = true }
litz-diagram = { workspace = true }
litz-fixture = { workspace = true }
