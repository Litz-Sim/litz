[package]
name = "litz"
description = "Open-source, modular firmware simulator: one core, native and WebAssembly, no cloud and no token."
keywords = ["simulator", "emulator", "embedded", "esp32", "wasm"]
categories = ["emulators", "embedded"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
litz-catalog = { workspace = true }
litz-core = { workspace = true }
litz-diagram = { workspace = true }
litz-esp = { workspace = true }
litz-mcu = { workspace = true }

[features]
default = ["esp32c3"]
esp32 = ["litz-esp/esp32"]
esp32c3 = ["litz-esp/esp32c3"]
esp32c6 = ["litz-esp/esp32c6"]
esp32s3 = ["litz-esp/esp32s3"]
esp32p4 = ["litz-esp/esp32p4"]
esp32s31 = ["litz-esp/esp32s31"]
