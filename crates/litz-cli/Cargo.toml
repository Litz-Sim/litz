[package]
name = "litz-cli"
# The board and part scaffolds ship with the binary: `litz catalog new` writes
# them from `include_str!`, so a crate installed with `cargo install` needs the
# files in its tarball. They live in directories with their own `Cargo.toml`,
# which Cargo otherwise treats as nested packages and leaves out.
include = ["src/**", "tests/**", "templates/**", "Cargo.toml"]
# 0.1.0's packaged lockfile pins litz-catalog 0.1.0, which predates the bench
# supply's current_limit attribute. `cargo install --locked` would keep serving
# it; this patch carries the refreshed lock.
version.workspace = true
description = "Command-line runner for Litz firmware simulations, designed to work as a GitHub Actions test step."
keywords = ["simulator", "cli", "ci", "embedded"]
categories = ["emulators", "command-line-utilities"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "litz"
path = "src/main.rs"

[dependencies]
litz-catalog = { workspace = true }
litz-diagram = { workspace = true }
litz-mcp = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `connect-editor` names an image by its SHA-256, so the page can fetch it by
# content rather than by a mutable path.
sha2 = "0.11.1"
toml = "1.2.1"
litz-engine = { workspace = true }

[dev-dependencies]
litz-fixture = { workspace = true }
