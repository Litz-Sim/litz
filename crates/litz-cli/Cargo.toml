[package]
name = "litz-cli"
description = "Command-line runner for Litz firmware simulations, designed to work as a GitHub Actions test step."
keywords = ["simulator", "cli", "ci", "embedded"]
categories = ["emulators", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "litz"
path = "src/main.rs"

[dependencies]
litz-catalog = { version = "0.0.1", path = "../litz-catalog" }
litz-diagram = { version = "0.0.1", path = "../litz-diagram" }
litz-mcp = { version = "0.0.1", path = "../litz-mcp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
litz-engine = { version = "0.0.1", path = "../litz-engine" }

[dev-dependencies]
litz-fixture = { path = "../litz-fixture" }
