[package]
name = "litz-catalog"
description = "Part and dev-board manifests for Litz: the catalog a circuit's part types resolve against."
keywords = ["simulator", "components", "catalog", "embedded"]
categories = ["emulators", "embedded"]
# 0.1.0 shipped the builtin catalog before the bench supply gained its
# `current_limit` attribute. The manifest data changed, so the patch release
# carries it; `^0.1.0` requirements pick this up.
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
litz-diagram = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
