[board]
id = "board-esp32-p4-function-ev"
name = "ESP32-P4-Function-EV"
version = "1.0.0"
description = "Espressif ESP32-P4-Function-EV (dual RV32IMAFC, no radio)"
chip = "esp32p4"
flash_size = "16MB"
psram = true
schematic = "onboard-devkit.json"

[[pins]]
name = "3V3"
fixed = "3v3"
label = "3.3 V rail"

[[pins]]
name = "5V"
fixed = "5v"
label = "USB 5 V rail"

[[pins]]
name = "GND"
fixed = "gnd"
repeat = 3

[[pins]]
name = "GPIO0"
gpio = 0

[[pins]]
name = "GPIO1"
gpio = 1

[[pins]]
name = "GPIO2"
gpio = 2

