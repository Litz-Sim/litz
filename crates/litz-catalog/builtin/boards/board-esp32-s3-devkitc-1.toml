[board]
id = "board-esp32-s3-devkitc-1"
name = "ESP32-S3-DevKitC-1"
version = "1.0.0"
description = "Espressif ESP32-S3-DevKitC-1 (Xtensa LX7, 2 MiB PSRAM)"
chip = "esp32s3"
flash_size = "8MB"
psram = true
schematic = "onboard-devkit.json"

[[pins]]
name = "3V3"
fixed = "3v3"
label = "3.3 V rail"

[[pins]]
name = "5V"
fixed = "5v"
label = "USB 5 V rail"

[[pins]]
name = "GND"
fixed = "gnd"
repeat = 3

[[pins]]
name = "GPIO0"
gpio = 0
functions = ["boot"]

[[pins]]
name = "GPIO1"
gpio = 1
functions = ["adc"]

[[pins]]
name = "GPIO2"
gpio = 2
functions = ["adc"]

[[pins]]
