[board]
id = "board-arduino-uno"
name = "Arduino Uno"
version = "1.0.0"
description = "ATmega328P at 16 MHz, 32 KiB flash, Arduino R3 header"
chip = "atmega328p"
flash_size = "32KB"
psram = false
schematic = "board-arduino-uno.onboard.json"

[[pins]]
name = "D0"
gpio = 0
label = "RX"
functions = ["serial"]

[[pins]]
name = "D1"
gpio = 1
label = "TX"
functions = ["serial"]

[[pins]]
name = "D2"
gpio = 2
functions = ["interrupt"]

[[pins]]
name = "D3"
gpio = 3
functions = ["interrupt", "pwm"]

[[pins]]
name = "D4"
gpio = 4

[[pins]]
name = "D5"
gpio = 5
functions = ["pwm"]

[[pins]]
name = "D6"
gpio = 6
functions = ["pwm"]

[[pins]]
name = "D7"
gpio = 7

[[pins]]
name = "D8"
gpio = 8

[[pins]]
name = "D9"
gpio = 9
functions = ["pwm"]

[[pins]]
name = "D10"
gpio = 10
functions = ["pwm", "spi"]

[[pins]]
name = "D11"
gpio = 11
functions = ["pwm", "spi"]

[[pins]]
name = "D12"
gpio = 12
functions = ["spi"]

[[pins]]
name = "D13"
gpio = 13
functions = ["spi", "led"]

[[pins]]
name = "A0"
gpio = 14
functions = ["adc"]

[[pins]]
name = "A1"
gpio = 15
functions = ["adc"]

[[pins]]
name = "A2"
gpio = 16
functions = ["adc"]

[[pins]]
name = "A3"
gpio = 17
functions = ["adc"]

[[pins]]
name = "A4"
gpio = 18
functions = ["adc", "i2c"]

[[pins]]
name = "A5"
gpio = 19
functions = ["adc", "i2c"]

[[pins]]
name = "5V"
fixed = "5v"
label = "5 V rail"

[[pins]]
name = "3V3"
fixed = "3v3"
label = "3.3 V rail"

[[pins]]
name = "VIN"
fixed = "vin"
label = "external supply"

[[pins]]
name = "GND"
fixed = "gnd"
repeat = 3