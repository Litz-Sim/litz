[board]
id = "board-esp32-c3-devkitm-1"
name = "ESP32-C3-DevKitM-1"
version = "1.0.0"
description = "Espressif ESP32-C3-DevKitM-1 development board"
chip = "esp32c3"
flash_size = "4MB"
psram = false
schematic = "board-esp32-c3-devkitm-1.onboard.json"

[[pins]]
name = "3V3"
fixed = "3v3"
label = "3.3 V rail"

[[pins]]
name = "5V"
fixed = "5v"
label = "USB 5 V rail"

[[pins]]
name = "GND"
fixed = "gnd"
repeat = 2

[[pins]]
name = "GPIO0"
gpio = 0
functions = ["adc", "boot"]

[[pins]]
name = "GPIO1"
gpio = 1
functions = ["adc"]

[[pins]]
name = "GPIO2"
gpio = 2
functions = ["adc", "strap"]

[[pins]]
name = "GPIO3"
gpio = 3
functions = ["adc"]

[[pins]]
name = "GPIO4"
gpio = 4
functions = ["adc"]

[[pins]]
name = "GPIO5"
gpio = 5
functions = ["adc"]

[[pins]]
name = "GPIO6"
gpio = 6

[[pins]]
name = "GPIO7"
gpio = 7

[[pins]]
name = "GPIO8"
gpio = 8
functions = ["strap"]
label = "onboard RGB LED"

[[pins]]
name = "GPIO9"
gpio = 9
functions = ["boot"]

[[pins]]
name = "GPIO10"
gpio = 10

[[pins]]
name = "GPIO18"
gpio = 18
functions = ["usb-d-"]

[[pins]]
name = "GPIO19"
gpio = 19
functions = ["usb-d+"]

[[pins]]
name = "GPIO20"
gpio = 20
functions = ["uart", "adc"]

[[pins]]
name = "GPIO21"
gpio = 21
functions = ["uart", "adc"]

[[pins]]
name = "TX"
gpio = 21
functions = ["uart"]
label = "UART0 TX"

[[pins]]
name = "RX"
gpio = 20
functions = ["uart"]
label = "UART0 RX"
