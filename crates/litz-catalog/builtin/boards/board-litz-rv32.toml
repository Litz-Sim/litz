[board]
id = "board-litz-rv32"
name = "Litz RV32 reference"
version = "1.0.0"
description = "Reference board whose MCU is a wasm component (crates/litz-chip-rv32)"
flash_size = "4MB"
psram = false
schematic = "board-litz-rv32.onboard.json"

# The MCU is a WebAssembly component that speaks litz:mcu@0.1.0, not a backend
# compiled into the runner. Exactly one of `chip` and this table is allowed.
[board.simulator]
kind = "wasm"
module = "litz-rv32.wasm"
abi = "litz-mcu-1"

[[pins]]
name = "3V3"
fixed = "3v3"
label = "3.3 V rail"

[[pins]]
name = "GND"
fixed = "gnd"
repeat = 2

[[pins]]
name = "GPIO0"
gpio = 0

[[pins]]
name = "GPIO1"
gpio = 1

[[pins]]
name = "GPIO2"
gpio = 2

[[pins]]
name = "GPIO3"
gpio = 3

[[pins]]
name = "GPIO4"
gpio = 4

[[pins]]
name = "GPIO5"
gpio = 5

[[pins]]
name = "GPIO6"
gpio = 6

[[pins]]
name = "GPIO7"
gpio = 7

[[pins]]
name = "GPIO8"
gpio = 8

[[pins]]
name = "GPIO9"
gpio = 9

[[pins]]
name = "GPIO10"
gpio = 10

# Console aliases, wired the way every diagram here wires them. The reference
# chip's console is a host channel rather than a pad, so these carry no
# traffic; they exist so a diagram written for a real board still validates.
[[pins]]
name = "GPIO20"
gpio = 20
functions = ["uart"]

[[pins]]
name = "GPIO21"
gpio = 21
functions = ["uart"]

[[pins]]
name = "RX"
gpio = 20
functions = ["uart"]
label = "UART0 RX"

[[pins]]
name = "TX"
gpio = 21
functions = ["uart"]
label = "UART0 TX"
