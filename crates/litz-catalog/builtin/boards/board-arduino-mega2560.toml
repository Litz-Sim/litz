[board]
id = "board-arduino-mega2560"
name = "Arduino Mega 2560"
version = "1.0.0"
description = "ATmega2560 at 16 MHz, 256 KiB flash, Mega header (D0-D53, A0-A15)"
chip = "atmega2560"
flash_size = "256KB"
psram = false
schematic = "board-arduino-mega2560.onboard.json"

[[pins]]
name = "D0"
gpio = 32
label = "RX0"
functions = ["serial"]

[[pins]]
name = "D1"
gpio = 33
label = "TX0"
functions = ["serial"]

[[pins]]
name = "D2"
gpio = 36
functions = ["interrupt"]

[[pins]]
