[board]
id = "board-esp32-c6-devkitc-1"
name = "ESP32-C6-DevKitC-1"
version = "1.0.0"
description = "Espressif ESP32-C6-DevKitC-1 (RV32IMAC, Wi-Fi 6 + Thread)"
chip = "esp32c6"
flash_size = "8MB"
psram = false
schematic = "onboard-devkit.json"

[[pins]]
name = "3V3"
fixed = "3v3"
label = "3.3 V rail"

[[pins]]
name = "5V"
fixed = "5v"
label = "USB 5 V rail"

[[pins]]
name = "GND"
fixed = "gnd"
repeat = 3

[[pins]]
name = "GPIO0"
gpio = 0

[[pins]]
name = "GPIO1"
gpio = 1

[[pins]]
name = "GPIO2"
gpio = 2
functions = ["adc"]

[[pins]]
name = "GPIO3"
gpio = 3
functions = ["adc"]

[[pins]]
name = "GPIO4"
gpio = 4
functions = ["adc"]

[[pins]]
name = "GPIO5"
gpio = 5
functions = ["adc"]

[[pins]]
name = "GPIO6"
gpio = 6
functions = ["adc"]

[[pins]]
name = "GPIO7"
gpio = 7
functions = ["adc"]

[[pins]]
name = "GPIO8"
gpio = 8
functions = ["strap"]

[[pins]]
name = "GPIO9"
gpio = 9
functions = ["boot"]

[[pins]]
name = "GPIO10"
gpio = 10

[[pins]]
name = "GPIO11"
gpio = 11

[[pins]]
name = "GPIO12"
gpio = 12

[[pins]]
name = "GPIO13"
gpio = 13

[[pins]]
name = "GPIO14"
gpio = 14

[[pins]]
name = "GPIO15"
gpio = 15

[[pins]]
name = "GPIO18"
gpio = 18
functions = ["usb-d-"]

[[pins]]
name = "GPIO19"
gpio = 19
functions = ["usb-d+"]

[[pins]]
name = "GPIO20"
gpio = 20
functions = ["uart"]

[[pins]]
name = "GPIO21"
gpio = 21

[[pins]]
name = "GPIO22"
gpio = 22

[[pins]]
name = "GPIO23"
gpio = 23

[[pins]]
name = "TX"
gpio = 16
functions = ["uart"]
label = "UART0 TX"

[[pins]]
name = "RX"
gpio = 17
functions = ["uart"]
label = "UART0 RX"

[[pins]]
name = "GPIO16"
gpio = 16
functions = ["uart"]

[[pins]]
name = "GPIO17"
gpio = 17
functions = ["uart"]