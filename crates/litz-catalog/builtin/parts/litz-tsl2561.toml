[part]
id = "litz-tsl2561"
name = "TSL2561"
version = "1.0.0"
description = "Two-channel ambient-light sensor"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.SDA]
kind = "i2c-sda"

[pins.SCL]
kind = "i2c-scl"

[pins.INT]
kind = "digital-out"

[attrs.lux]
type = "float"
default = 500.0

[buses.i2c0]
address = 0x39

[simulation]
backend = "builtin"
engine = "tsl2561"
