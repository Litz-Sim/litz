[part]
id = "litz-vibration-sensor"
name = "Vibration sensor"
version = "1.0.0"
description = "Spring-contact vibration module with analog and threshold outputs"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.AO]
kind = "analog-out"

[pins.DO]
kind = "digital-out"

[attrs.value]
type = "float"
default = 0

[attrs.threshold]
type = "float"
default = 500

[attrs.activeLow]
type = "bool"
default = false

[attrs.vref]
type = "float"
default = 5.0

[simulation]
backend = "builtin"
engine = "analog-sensor"
