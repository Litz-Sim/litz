[part]
id = "litz-neopixel-matrix"
name = "NeoPixel matrix"
version = "1.0.0"
description = "WS2812 addressable RGB matrix"
license = "MIT"

[pins.VDD]
kind = "power"

[pins.DOUT]
kind = "digital-out"

[pins.VSS]
kind = "ground"

[pins.DIN]
kind = "digital-in"

[attrs.rows]
type = "int"
default = 8

[attrs.cols]
type = "int"
default = 8

[simulation]
backend = "builtin"
engine = "neopixel"
