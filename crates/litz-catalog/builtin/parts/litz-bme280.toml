[part]
id = "litz-bme280"
name = "BME280"
version = "1.0.0"
description = "Temperature, pressure and humidity sensor"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.SDA]
kind = "i2c-sda"

[pins.SCL]
kind = "i2c-scl"

[attrs.temperature]
type = "float"
default = 25.0

[attrs.humidity]
type = "float"
default = 50.0

[attrs.pressure]
type = "float"
default = 101325.0

[buses.i2c0]
address = 0x76

[simulation]
backend = "builtin"
engine = "bme280"
