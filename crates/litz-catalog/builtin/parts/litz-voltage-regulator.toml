[part]
id = "litz-voltage-regulator"
name = "Voltage regulator"
version = "1.0.0"
description = "Three-terminal linear voltage regulator"
license = "MIT"

[pins.VI]
kind = "power"
label = "input"

[pins.GND]
kind = "ground"
label = "ground"

[pins.VO]
kind = "power"
label = "output"

# The LM317's feedback pin. Wire a divider from VO to this pin and GND and the
# output is 1.25 V times (1 + R2/R1); leave it unwired to use the `voltage`
# attribute (or the host's dial) instead.
[pins.ADJ]
kind = "analog-in"
label = "adjust"

[attrs.variant]
type = "enum"
values = ["7805", "7812", "7905", "LM317"]
default = "7805"

# Output voltage for the adjustable LM317; the fixed parts ignore it.
[attrs.voltage]
type = "float"
default = 5.0

[simulation]
backend = "builtin"
engine = "voltage-regulator"