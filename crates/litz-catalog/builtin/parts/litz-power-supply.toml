[part]
id = "litz-power-supply"
name = "Power supply"
version = "1.0.0"
description = "Adjustable DC bench supply with a current limit"
license = "MIT"

[pins."+"]
kind = "power"
label = "positive terminal"

[pins."-"]
kind = "ground"
label = "negative terminal"

[attrs.voltage]
type = "float"
default = 5.0

# Amperes. Zero means no limit; a positive value folds the supply back from
# constant voltage to constant current when the load asks for more.
[attrs.current_limit]
type = "float"
default = 0.0

[simulation]
backend = "builtin"
engine = "voltage-source"