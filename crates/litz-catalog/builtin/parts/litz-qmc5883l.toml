[part]
id = "litz-qmc5883l"
name = "QMC5883L"
version = "1.0.0"
description = "Three-axis magnetometer"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.SDA]
kind = "i2c-sda"

[pins.SCL]
kind = "i2c-scl"

[pins.DRDY]
kind = "digital-out"
label = "data ready"

# Magnetic field in microtesla, one attribute per axis.
[attrs.x]
type = "float"
default = 0.0

[attrs.y]
type = "float"
default = 0.0

[attrs.z]
type = "float"
default = 50.0

[buses.i2c0]
address = 0x0d

[simulation]
backend = "builtin"
engine = "qmc5883l"
