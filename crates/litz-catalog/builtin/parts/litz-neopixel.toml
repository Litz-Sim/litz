[part]
id = "litz-neopixel"
name = "NeoPixel"
version = "1.0.0"
description = "WS2812 addressable RGB LED"
license = "MIT"

[pins.VDD]
kind = "power"

[pins.DOUT]
kind = "digital-out"

[pins.VSS]
kind = "ground"

[pins.DIN]
kind = "digital-in"

[attrs.pixels]
type = "int"
default = 1

[simulation]
backend = "builtin"
engine = "neopixel"
