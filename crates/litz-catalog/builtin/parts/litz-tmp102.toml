[part]
id = "litz-tmp102"
name = "TMP102"
version = "1.0.0"
description = "12-bit I2C temperature sensor"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.SDA]
kind = "i2c-sda"

[pins.SCL]
kind = "i2c-scl"

[pins.ADD0]
kind = "digital-in"
label = "address select"

[pins.ALERT]
kind = "digital-out"
label = "comparator/alert output"

[attrs.temperature]
type = "float"
default = 25.0

[buses.i2c0]
address = 0x48

[simulation]
backend = "builtin"
engine = "tmp102"
