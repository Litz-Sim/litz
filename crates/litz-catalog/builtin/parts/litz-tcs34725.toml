[part]
id = "litz-tcs34725"
name = "TCS34725"
version = "1.0.0"
description = "RGBC colour sensor with a white LED"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.SDA]
kind = "i2c-sda"

[pins.SCL]
kind = "i2c-scl"

[pins.INT]
kind = "digital-out"

[pins.LED]
kind = "digital-in"

[attrs.clear]
type = "int"
default = 1000

[attrs.red]
type = "int"
default = 2000

[attrs.green]
type = "int"
default = 1000

[attrs.blue]
type = "int"
default = 500

[buses.i2c0]
address = 0x29

[simulation]
backend = "builtin"
engine = "tcs34725"
