[part]
id = "litz-epaper-1in54"
name = "E-paper 1.54"
version = "1.0.0"
description = "1-bit SPI e-paper panel, 200x200"
license = "MIT"

[pins.VCC]
kind = "power"

[pins.GND]
kind = "ground"

[pins.DIN]
kind = "spi-mosi"

[pins.CLK]
kind = "spi-sck"

[pins.CS]
kind = "spi-cs"

[pins.DC]
kind = "digital-in"

[pins.RST]
kind = "digital-in"

[pins.BUSY]
kind = "digital-out"

[attrs.size]
type = "enum"
values = ["1.54", "2.13"]
default = "1.54"

[buses.spi0]
cs = "CS"

[simulation]
backend = "builtin"
engine = "epaper"
