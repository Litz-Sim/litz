[part]
id = "litz-led-strip"
name = "WS2812 LED strip"
version = "1.0.0"
description = "Addressable RGB LED strip on one data line"
license = "MIT"

[pins.VDD]
kind = "power"

[pins.VSS]
kind = "ground"

[pins.DIN]
kind = "digital-in"

[pins.DOUT]
kind = "digital-out"

[attrs.pixels]
type = "int"
default = 8

[simulation]
backend = "builtin"
engine = "neopixel"
