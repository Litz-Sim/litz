[package]
name = "litz-diagram"
description = "Circuit and netlist model for Litz: reads diagram.json and resolves wires into nets."
keywords = ["simulator", "schematic", "netlist", "diagram"]
categories = ["emulators", "embedded"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
