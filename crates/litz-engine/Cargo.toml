[package]
name = "litz-engine"
description = "The embeddable Litz engine: project loading, boot, the run loop, assertions, probes and protocol decoding."
keywords = ["simulator", "engine", "embedded", "emulator"]
categories = ["emulators"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
litz-avr = { version = "0.0.1", path = "../litz-avr" }
litz-rp = { version = "0.0.1", path = "../litz-rp" }
litz-ble = { version = "0.0.1", path = "../litz-ble" }
litz-board = { version = "0.0.1", path = "../litz-board" }
litz-catalog = { version = "0.0.1", path = "../litz-catalog" }
litz-core = { version = "0.0.1", path = "../litz-core" }
litz-decode = { version = "0.0.1", path = "../litz-decode" }
litz-diagram = { version = "0.0.1", path = "../litz-diagram" }
litz-esp = { version = "0.0.1", path = "../litz-esp", features = ["esp32", "esp32c3", "esp32c6", "esp32s3", "esp32p4", "esp32s31"] }
litz-net = { version = "0.0.1", path = "../litz-net" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
toml = "1.2.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
litz-mcu-wasm = { version = "0.0.1", path = "../litz-mcu-wasm" }
