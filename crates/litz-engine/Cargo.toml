[package]
name = "litz-engine"
description = "The embeddable Litz engine: project loading, boot, the run loop, assertions, probes and protocol decoding."
keywords = ["simulator", "engine", "embedded", "emulator"]
categories = ["emulators"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
litz-avr = { version = "0.1.0", path = "../litz-avr" }
litz-rp = { version = "0.1.0", path = "../litz-rp" }
litz-ble = { version = "0.1.0", path = "../litz-ble" }
litz-board = { version = "0.1.0", path = "../litz-board" }
litz-catalog = { version = "0.1.0", path = "../litz-catalog" }
litz-core = { version = "0.1.0", path = "../litz-core" }
litz-decode = { version = "0.1.0", path = "../litz-decode" }
litz-diagram = { version = "0.1.0", path = "../litz-diagram" }
litz-net = { version = "0.1.0", path = "../litz-net" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
toml = "1.2.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
litz-mcu-wasm = { version = "0.1.0", path = "../litz-mcu-wasm" }
# The Xtensa chips (classic ESP32 and S3) execute guest blocks through a host
# JIT on wasm32, which is a host import; the zero-import browser module leaves
# them out and boots the RISC-V ESP parts, the AVR and the RP2040 instead.
litz-esp = { version = "0.1.0", path = "../litz-esp", features = ["esp32", "esp32c3", "esp32c6", "esp32s3", "esp32p4", "esp32s31"] }

[target.'cfg(target_family = "wasm")'.dependencies]
litz-esp = { version = "0.1.0", path = "../litz-esp", features = ["esp32c3", "esp32c6", "esp32p4", "esp32s31"] }
