[project]
diagram = "diagram.json"

[sim]
firmware = "../../build/micropython/ESP32_GENERIC_C3-20260824-v1.29.0.bin"
rom = "build/micropython/esp32c3_rev3_rom.elf"
runtime = "micropython"
script = "main.py"
flash_size = "4MB"

# The press is host input: `level = 0` holds the button down, and the script
# sees the pin go low and lights GPIO8 while it stays there.
[[test]]
name = "holding the button lights the LED"
timeout = "20s"
expect = ["litz: button", "litz: pressed", "litz: done"]
expect_state = "led1:on"

[[test.input]]
at = "500ms"
pin = "btn1"
level = 0