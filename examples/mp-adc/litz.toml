[project]
diagram = "diagram.json"

[sim]
firmware = "../../build/micropython/ESP32_GENERIC_C3-20260824-v1.29.0.bin"
rom = "build/micropython/esp32c3_rev3_rom.elf"
runtime = "micropython"
script = "main.py"
flash_size = "4MB"

# The wiper sits at half travel, so the ADC reads mid scale and the script
# prints the band it fell in. `[[test.input]] pin` asserts a digital level and
# cannot move an ADC, so the assertion is on what the conversion produced.
[[test]]
name = "the ADC reads the potentiometer at mid scale"
timeout = "20s"
expect = ["litz: adc", "litz: mid"]
expect_state = "led1:on"