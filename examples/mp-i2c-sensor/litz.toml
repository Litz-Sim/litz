[project]
diagram = "diagram.json"

[sim]
firmware = "../../build/micropython/ESP32_GENERIC_C3-20260824-v1.29.0.bin"
rom = "build/micropython/esp32c3_rev3_rom.elf"
runtime = "micropython"
script = "main.py"
flash_size = "4MB"

# The BMP280's chip-id register at 0xD0 reads 0x58. A register read is a write
# of the pointer followed by a read, so both directions are exercised.
[[test]]
name = "the BMP280 chip id reads 0x58"
timeout = "20s"
expect = ["litz: bmp280", "litz: chip 0x58", "litz: bmp280 ok"]