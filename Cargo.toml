[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["build", "vendor"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
authors = ["redelectricity"]
repository = "https://github.com/Litz-Sim/litz"
homepage = "https://github.com/Litz-Sim/litz#readme"

[workspace.dependencies]
litz = { version = "0.7", path = "crates/litz" }
litz-analog = { version = "0.7", path = "crates/litz-analog" }
litz-avr = { version = "0.7", path = "crates/litz-avr" }
litz-ble = { version = "0.7", path = "crates/litz-ble" }
litz-board = { version = "0.7", path = "crates/litz-board" }
litz-catalog = { version = "0.7", path = "crates/litz-catalog" }
litz-chip-conformance = { version = "0.7", path = "crates/litz-chip-conformance" }
litz-chip-rv32 = { version = "0.7", path = "crates/litz-chip-rv32" }
litz-cli = { version = "0.7", path = "crates/litz-cli" }
litz-core = { version = "0.7", path = "crates/litz-core" }
litz-decode = { version = "0.7", path = "crates/litz-decode" }
litz-diagram = { version = "0.7", path = "crates/litz-diagram" }
litz-editor = { version = "0.7", path = "crates/litz-editor" }
litz-engine = { version = "0.7", path = "crates/litz-engine" }
litz-esp = { version = "0.7", path = "crates/litz-esp" }
litz-fixture = { version = "0.7", path = "crates/litz-fixture" }
litz-ieee802154 = { version = "0.7", path = "crates/litz-ieee802154" }
litz-mcp = { version = "0.7", path = "crates/litz-mcp" }
litz-mcu = { version = "0.7", path = "crates/litz-mcu" }
litz-mcu-wasm = { version = "0.7", path = "crates/litz-mcu-wasm" }
litz-mcu-wit = { version = "0.7", path = "crates/litz-mcu-wit" }
litz-net = { version = "0.7", path = "crates/litz-net" }
litz-part-74hc595 = { version = "0.7", path = "crates/litz-part-74hc595" }
litz-part-display = { version = "0.7", path = "crates/litz-part-display" }
litz-part-eeprom = { version = "0.7", path = "crates/litz-part-eeprom" }
litz-part-runaway = { version = "0.7", path = "crates/litz-part-runaway" }
litz-part-sdk = { version = "0.7", path = "crates/litz-part-sdk" }
litz-part-wasm = { version = "0.7", path = "crates/litz-part-wasm" }
litz-part-wit = { version = "0.7", path = "crates/litz-part-wit" }
litz-project = { version = "0.7", path = "crates/litz-project" }
litz-radio = { version = "0.7", path = "crates/litz-radio" }
litz-rp = { version = "0.7", path = "crates/litz-rp" }
litz-wasm = { version = "0.7", path = "crates/litz-wasm" }

# The wasm module is downloaded by every visitor of the browser simulator, so
# the release profile is tuned for it: one codegen unit and thin LTO give the
# optimiser the whole crate graph, and abort-on-panic drops the unwinding
# tables that only matter to a host that catches panics (none does).
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The ESP32 chips are the esp32sim fork, renamed under `litz-*` and kept in
# `vendor/`. They are path dependencies of `litz-esp` so a change to the fork
# is one commit, and the same names exist on crates.io so `cargo publish`
# rewrites the paths to registry versions. Each fork carries its local patch
# notes in `PATCH.md`; the rest of the crate is upstream `d043ff1`.

# rustls asks for the clock on every target, including `wasm32-unknown-unknown`
# where its only clock imports JavaScript. The simulator instantiates with an
# empty import object, so `vendor/rustls-pki-types` answers the call with the
# epoch; both TLS ends install a fixed `TimeProvider` and never read it.
[patch.crates-io]
rustls-pki-types = { path = "vendor/rustls-pki-types" }
