[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["build", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["redelectricity"]
repository = "https://github.com/Litz-Sim/litz"
homepage = "https://github.com/Litz-Sim/litz#readme"

# The wasm module is downloaded by every visitor of the browser simulator, so
# the release profile is tuned for it: one codegen unit and thin LTO give the
# optimiser the whole crate graph, and abort-on-panic drops the unwinding
# tables that only matter to a host that catches panics (none does).
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The ESP32 chips are the esp32sim fork, renamed under `litz-*` and kept in
# `vendor/`. They are path dependencies of `litz-esp` so a change to the fork
# is one commit, and the same names exist on crates.io so `cargo publish`
# rewrites the paths to registry versions. Each fork carries its local patch
# notes in `PATCH.md`; the rest of the crate is upstream `d043ff1`.

# rustls asks for the clock on every target, including `wasm32-unknown-unknown`
# where its only clock imports JavaScript. The simulator instantiates with an
# empty import object, so `vendor/rustls-pki-types` answers the call with the
# epoch; both TLS ends install a fixed `TimeProvider` and never read it.
[patch.crates-io]
rustls-pki-types = { path = "vendor/rustls-pki-types" }
