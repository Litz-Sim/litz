[package]
name = "litz-esp32s31"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Litz fork of esp32sim: ESP32-S31 on esp_soc::Machine: dual-hart, DeviceSet peripherals, ROM and Flash-MMU app boot"

repository = "https://github.com/Litz-Sim/litz"
homepage = "https://github.com/Litz-Sim/litz#readme"

[lib]
name = "esp32s31"

[dependencies]
litz-emu-core = { version = "0.1.0", path = "../emu-core" }
litz-esp-periph = { version = "0.1.0", path = "../esp-periph" }
litz-esp-soc = { version = "0.1.0", path = "../esp-soc" }
litz-riscv-rv32 = { version = "0.1.0", path = "../riscv-rv32" }
