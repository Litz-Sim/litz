[package]
name = "litz-esp32"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Litz fork of esp32sim: Classic ESP32 SoC model: memory map, peripherals, machine"

repository = "https://github.com/Litz-Sim/litz"
homepage = "https://github.com/Litz-Sim/litz#readme"

[lib]
name = "esp32"

[dependencies]
litz-emu-core = { version = "0.1.0", path = "../emu-core" }
litz-esp-periph = { version = "0.1.0", path = "../esp-periph" }
litz-esp-soc = { version = "0.1.2", path = "../esp-soc" }
litz-xtensa-lx7 = { version = "0.1.0", path = "../xtensa-lx7" }
